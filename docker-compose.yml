services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketflow
      POSTGRES_PASSWORD: marketflow
      POSTGRES_DB: marketflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketflow -d marketflow"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
